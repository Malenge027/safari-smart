<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safari Smart - Bookings</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand"><a th:href="@{/admin/dashboard}"><img src="https://images.unsplash.com/photo-1621414050966-3f67f3aa64a6?w=80" alt="Kilimanjaro" class="nav-logo-img"> Safari Smart</a></div>
        <div class="nav-links">
            <a th:href="@{/admin/dashboard}"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a th:href="@{/packages}"><i class="fas fa-binoculars"></i> Packages</a>
            <a th:href="@{/bookings}"><i class="fas fa-calendar-alt"></i> Bookings</a>
            <a th:href="@{/payments}"><i class="fas fa-money-bill-wave"></i> Payments</a>
            <a th:href="@{/users}"><i class="fas fa-users"></i> Users</a>
            <a th:href="@{/logout}" class="btn btn-sm btn-danger"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1><i class="fas fa-calendar-alt"></i> Bookings</h1>
            <a th:href="@{/bookings/new}" class="btn btn-primary"><i class="fas fa-plus"></i> New Booking</a>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th><i class="fas fa-hashtag"></i> ID</th>
                        <th><i class="fas fa-user"></i> Customer</th>
                        <th><i class="fas fa-binoculars"></i> Package</th>
                        <th><i class="fas fa-calendar"></i> Travel Date</th>
                        <th><i class="fas fa-users"></i> People</th>
                        <th><i class="fas fa-dollar-sign"></i> Total</th>
                        <th><i class="fas fa-credit-card"></i> Payment</th>
                        <th><i class="fas fa-flag"></i> Status</th>
                        <th><i class="fas fa-cog"></i> Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="booking : ${bookings}">
                        <td th:text="'#' + ${booking.id}">ID</td>
                        <td th:text="${booking.user?.name}">Customer</td>
                        <td th:text="${booking.safariPackage?.name}">Package</td>
                        <td th:text="${booking.travelDate}">Date</td>
                        <td th:text="${booking.numberOfPeople}">People</td>
                        <td th:text="'$' + ${#numbers.formatInteger(booking.totalAmount, 1, 'COMMA')}">$0</td>
                        <td>
                            <span class="badge badge-success" th:if="${booking.paid}"><i class="fas fa-check"></i> PAID</span>
                            <span class="badge badge-warning" th:unless="${booking.paid}"><i class="fas fa-times"></i> UNPAID</span>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${booking.status.name() == 'CONFIRMED'} ? 'badge-success' : (${booking.status.name() == 'PENDING'} ? 'badge-warning' : 'badge-danger')"
                                  th:text="${booking.status}">Status</span>
                        </td>
                        <td class="actions">
                            <a th:href="@{/payments/receipt/{bookingId}(bookingId=${booking.id})}" class="btn btn-sm btn-info"><i class="fas fa-receipt"></i></a>
                            <a th:href="@{/bookings/{id}/delete(id=${booking.id})}" class="btn btn-sm btn-danger"
                               onclick="return confirm('Delete this booking?')"><i class="fas fa-trash"></i></a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <footer class="footer"><p>&copy; 2026 Safari Smart</p></footer>
</body>
</html>
