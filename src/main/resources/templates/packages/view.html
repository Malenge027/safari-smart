<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safari Smart - Package Details</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand"><a th:href="@{/}"><img src="https://images.unsplash.com/photo-1621414050966-3f67f3aa64a6?w=80" alt="Kilimanjaro" class="nav-logo-img"> Safari Smart</a></div>
        <div class="nav-links">
            <a th:href="@{/}">Home</a>
            <a th:href="@{/packages}">Safari Packages</a>
            <a th:href="@{/bookings}">Bookings</a>
            <a th:href="@{/users}">Users</a>
        </div>
    </nav>

    <div class="container">
        <div class="detail-card">
            <div class="detail-header">
                <div>
                    <h1 th:text="${safariPackage.name}">Package Name</h1>
                    <span class="package-category" th:text="${safariPackage.category?.name}">Category</span>
                </div>
                <div class="detail-actions">
                    <a th:href="@{/packages/{id}/edit(id=${safariPackage.id})}" class="btn btn-warning">Edit</a>
                    <a th:href="@{/bookings/new(packageId=${safariPackage.id})}" class="btn btn-primary">Book Now</a>
                </div>
            </div>

            <div class="detail-body">
                <div class="detail-image">
                    <img th:src="${safariPackage.imageUrl}" th:alt="${safariPackage.name}"
                         onerror="this.src='https://images.unsplash.com/photo-1516426122078-c23e76319801?w=800'">
                </div>
                <div class="detail-info">
                    <div class="info-row">
                        <strong>Destination:</strong>
                        <span th:text="${safariPackage.destination}">Destination</span>
                    </div>
                    <div class="info-row">
                        <strong>Duration:</strong>
                        <span th:text="${safariPackage.durationDays} + ' Days'">Duration</span>
                    </div>
                    <div class="info-row">
                        <strong>Price per person:</strong>
                        <span class="price" th:text="'$' + ${#numbers.formatInteger(safariPackage.price, 1, 'COMMA')}">$0</span>
                    </div>
                    <div class="info-row">
                        <strong>Max Capacity:</strong>
                        <span th:text="${safariPackage.maxCapacity} + ' people'">Capacity</span>
                    </div>
                    <div class="info-row">
                        <strong>Description:</strong>
                        <p th:text="${safariPackage.description}">Description</p>
                    </div>
                </div>
            </div>
        </div>
        <a th:href="@{/packages}" class="btn btn-secondary">&larr; Back to Packages</a>
    </div>

    <footer class="footer"><p>&copy; 2026 Safari Smart</p></footer>
</body>
</html>
