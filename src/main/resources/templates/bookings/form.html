<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safari Smart - New Booking</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand"><a th:href="@{/}"><img src="https://images.unsplash.com/photo-1621414050966-3f67f3aa64a6?w=80" alt="Kilimanjaro" class="nav-logo-img"> Safari Smart</a></div>
        <div class="nav-links">
            <a th:href="@{/}">Home</a>
            <a th:href="@{/packages}">Safari Packages</a>
            <a th:href="@{/bookings}">Bookings</a>
            <a th:href="@{/users}">Users</a>
        </div>
    </nav>

    <div class="container">
        <div class="form-card">
            <h1>New Booking</h1>

            <form th:action="@{/bookings/save}" method="post">

                <h3 class="form-section-title">Your Details</h3>

                <div class="form-group">
                    <label for="customerName">Full Name</label>
                    <input type="text" id="customerName" name="customerName" class="form-control" placeholder="Enter your full name" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="customerEmail">Email</label>
                        <input type="email" id="customerEmail" name="customerEmail" class="form-control" placeholder="your@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="customerPhone">Phone Number</label>
                        <input type="tel" id="customerPhone" name="customerPhone" class="form-control" placeholder="+255 7XX XXX XXX" required>
                    </div>
                </div>

                <h3 class="form-section-title">Safari Details</h3>

                <div class="form-group">
                    <label for="safariPackageId">Safari Package</label>
                    <select id="safariPackageId" name="safariPackageId" class="form-control" required>
                        <option value="">Select Package</option>
                        <option th:each="pkg : ${packages}" th:value="${pkg.id}"
                                th:text="${pkg.name} + ' - $' + ${#numbers.formatInteger(pkg.price, 1, 'COMMA')}"
                                th:selected="${pkg.id == selectedPackageId}">Package</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="travelDate">Travel Date</label>
                        <input type="date" id="travelDate" name="travelDate" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="numberOfPeople">Number of People</label>
                        <input type="number" id="numberOfPeople" name="numberOfPeople" class="form-control" min="1" value="1" required>
                    </div>
                </div>

                <div class="form-actions">
                    <a th:href="@{/bookings}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Create Booking</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="footer"><p>&copy; 2026 Safari Smart</p></footer>
</body>
</html>
