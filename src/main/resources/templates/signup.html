<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safari Smart - Sign Up</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="login-body">
    <div class="giraffe-watermark" style="bottom:20px; right:20px; width:250px;">
        <img src="https://images.unsplash.com/photo-1748799443018-1b0df21f5786?w=600" alt="Giraffes">
    </div>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1><img src="https://images.unsplash.com/photo-1621414050966-3f67f3aa64a6?w=80" alt="Kilimanjaro" class="nav-logo-img"> Safari Smart</h1>
                <p>Create your account</p>
            </div>

            <div class="error-message" th:if="${error}">
                <p><i class="fas fa-exclamation-circle"></i> <span th:text="${error}">Error</span></p>
            </div>

            <form th:action="@{/signup}" method="post">
                <div class="form-group">
                    <label for="name"><i class="fas fa-user"></i> Full Name</label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="phone"><i class="fas fa-phone"></i> Phone Number</label>
                    <input type="tel" id="phone" name="phone" class="form-control" placeholder="+255 7XX XXX XXX" required>
                </div>

                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Create a password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg"><i class="fas fa-user-plus"></i> Sign Up</button>
            </form>

            <div class="login-footer">
                <p>Already have an account? <a th:href="@{/login}" style="color: #1a5f2a; font-weight: 600;"><i class="fas fa-sign-in-alt"></i> Sign In</a></p>
            </div>
        </div>
    </div>
</body>
</html>
